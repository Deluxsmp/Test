<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গেম মোড পোর্টাল</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; }
        
        /* কন্টেইনার স্টাইল */
        .scroll-container { 
            display: flex; 
            overflow-x: auto; /* ডানে স্লাইড করার জন্য */
            gap: 10px; 
            padding: 10px;
            white-space: nowrap;
            scrollbar-width: none; /* স্ক্রলবার লুকানোর জন্য */
        }
        .scroll-container::-webkit-scrollbar { display: none; }

        .card { 
            background: white; 
            padding: 12px 20px; 
            border-radius: 8px; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            text-decoration: none; 
            color: #333; 
            font-weight: bold;
            flex-shrink: 0; /* বাটনগুলো যেন ছোট না হয়ে যায় */
        }
        
        .card:hover { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>আমাদের গেম মোডসমূহ</h1>
    <div class="scroll-container">
        <a href="overview.html" class="card">Overview</a>
        <a href="nethpot.html" class="card">NethPot</a>
        <a href="mace.html" class="card">Mace</a>
        <a href="spear.html" class="card">Spear</a>
        <a href="pot.html" class="card">Pot</a>
        <a href="tank.html" class="card">Tank</a>
        <a href="crystal.html" class="card">Crystal</a>
        <a href="smp.html" class="card">SMP</a>
        <a href="build.html" class="card">Build</a>
        <a href="uhc.html" class="card">UHC</a>
        <a href="manhunt.html" class="card">Manhunt</a>
    </div>

</body>
</html>
