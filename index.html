<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #1a1a2e; font-family: sans-serif; margin: 0; padding: 20px; }
        
        .nav-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 5px; 
            background-color: #252538; 
            padding: 10px; 
            border-radius: 12px;
            white-space: nowrap;
        }
        
        .nav-container::-webkit-scrollbar { display: none; }

        .item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            color: #b0b0c3; 
            text-decoration: none; 
            font-size: 14px;
            transition: 0.3s;
            border-radius: 8px;
            min-width: 60px;
        }

        .item:hover { background-color: #353550; color: white; }
        
        .icon { font-size: 24px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="nav-container">

        <a href="#" class="item"><span class="icon">🧱</span>Build</a>
        <a href="#" class="item"><span class="icon">❤️</span>UHC</a>
        <a href="#" class="item"><span class="icon">🏃</span>Manhunt</a>
    </div>

</body>
</html>
